name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (zsh on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is free on private repos. Add macos-latest here after the
        # repo goes public (macOS minutes are billable for private repos).
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check
        run: zsh -n codex-switch.zsh

      - name: Smoke tests
        run: zsh tests/smoke.zsh

  install-e2e:
    name: install E2E (fresh user, ubuntu:24.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zsh python3

      - name: Install-time end-to-end test
        run: zsh tests/install-e2e.zsh
        env:
          CX_E2E_SRC: ${{ github.workspace }}
