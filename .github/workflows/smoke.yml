name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (zsh on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is free on private repos. Add macos-latest here after the
        # repo goes public (macOS minutes are billable for private repos).
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check
        run: zsh -n codex-switch.zsh

      - name: Smoke tests
        run: zsh tests/smoke.zsh
